<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title> account sign-up</title>
        <link rel="stylesheet" href="style5.css">
    </head>
    <body>
        <div class="white-wrapper">
        <h1>Training Course</h1>
        <div class="signup-card">
            <h2>Sign Up Here</h2>
            <form action="index2.html" method="POST">
                <div class="input-group">
                    <input type="text" placeholder="Title">
                </div>
                <div class="input-group">
                    <input type="text" placeholder="First Name">
                </div>
                <div class="input-group">
                    <input type="text" placeholder="Last Name">
                </div>
                <div class="input-group">
                    <input type="text" placeholder="Position">
                </div>
                <div class="input-group">
                    <input type="text" placeholder="Company">
                </div>
                <div class="input-group">
                    <input type="email" placeholder="Email">
                </div>
                <div class="input-group">
                    <input type="address" placeholder="Street Address">
                </div>
                <div class="input-group">
                    <input type="text" placeholder="Street Address Line2">
                    </div>
                    <div class="form-row">
                    <div class="input-group">
                    <select required>
                            <option value="disabled selected hidden">Country</option>
                            <option value="AUS">Australia</option>
                            <option value="CA">Canada</option>
                            <option value="IND">India</option>
                            <option value="UK">United Kingdom</option>
                            <option value="US">United States</option>
                        </select>
                        </div>
                    <div class="input-group">
                        <input type="text" placeholder="City" required>
                    </div>
                    </div>
                    <div class="form-row">
                    <div class="input-group">
                        <input type="text" placeholder="State/Province/Region" required>
                    </div>
                    <div class="input-group">
                        <input type="text" placeholder="Zip/Postal Code" required>
                    </div>
                    </div>
                    <div class="input-group">
                        <input type="tel" placeholder="Phone Number" required>
                    </div>
                    <button type="submit" class="btn-signup">Submit</button>
                </div>
                        
            </form>
        </div>
    </div>
    </body>
    </html>
